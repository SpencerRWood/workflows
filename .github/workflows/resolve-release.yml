name: Resolve release

on:
  workflow_call:
    inputs:
      ref:
        description: Existing release tag; empty selects the latest published release.
        required: false
        type: string
        default: ''
    outputs:
      ref:
        description: Verified published release tag.
        value: ${{ jobs.resolve.outputs.ref }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_REF" ]]; then
            ref=$(gh release view "$REQUESTED_REF" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName')
          else
            ref=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

name: Verify accumulated release candidate
on:
  workflow_call:
    inputs:
      workflow_revision:
        type: string
        required: true
      wood_revision:
        description: Reviewed immutable Wood Tools source SHA.
        type: string
        required: true
      integration_command:
        type: string
        required: true
      security_command:
        type: string
        required: true
      deferred_stories:
        description: JSON map of scoped Story IDs to reasons, requiring explicit release approval.
        type: string
        default: '{}'
      hotfix_incident:
        type: string
        default: ''
      hotfix_approval:
        type: string
        default: ''
      runner:
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      dbt_host:
        required: false
      dbt_user:
        required: false
      dbt_password:
        required: false
      dbt_port:
        required: false
      dbt_dbname:
        required: false
      dbt_schema:
        required: false
      openproject_api_token:
        required: true
      release_read_token:
        required: false
permissions:
  contents: read
jobs:
  release-readiness:
    name: release-readiness
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Require a main integration PR
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: test "$EVENT" = pull_request && test "$BASE" = main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install pinned control tools
        env:
          WORKFLOW_SHA: ${{ inputs.workflow_revision }}
          WOOD_SHA: ${{ inputs.wood_revision }}
          GH_TOKEN: ${{ secrets.release_read_token || github.token }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ && "$WOOD_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh auth setup-git
          for repository in workflows wood-tools; do
            revision="$WORKFLOW_SHA"
            if [[ "$repository" == wood-tools ]]; then revision="$WOOD_SHA"; fi
            git init "$RUNNER_TEMP/$repository"
            git -C "$RUNNER_TEMP/$repository" remote add origin "https://github.com/SpencerRWood/$repository.git"
            git -C "$RUNNER_TEMP/$repository" fetch --depth 1 origin "$revision"
            git -C "$RUNNER_TEMP/$repository" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/$repository" rev-parse HEAD)" = "$revision"
          done
          uv sync --frozen --directory "$RUNNER_TEMP/wood-tools"
          echo "$RUNNER_TEMP/wood-tools/.venv/bin" >> "$GITHUB_PATH"
      - name: Load consumer capabilities
        id: config
        run: python3 "$RUNNER_TEMP/workflows/scripts/release_config.py" .github/release.toml
      - name: Install locked consumer check dependencies
        working-directory: ${{ steps.config.outputs.working_directory }}
        run: uv sync --frozen --group "${{ steps.config.outputs.dependency_group }}"
      - name: Execute mandatory release verification
        env:
          GH_TOKEN: ${{ secrets.release_read_token || github.token }}
          OPENPROJECT_URL: ${{ vars.OPENPROJECT_URL }}
          OPENPROJECT_API_TOKEN: ${{ secrets.openproject_api_token }}
          DBT_HOST: ${{ secrets.dbt_host }}
          DBT_USER: ${{ secrets.dbt_user }}
          DBT_PASSWORD: ${{ secrets.dbt_password }}
          DBT_PORT: ${{ secrets.dbt_port }}
          DBT_DBNAME: ${{ secrets.dbt_dbname }}
          DBT_SCHEMA: ${{ secrets.dbt_schema }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BRANCH: ${{ github.head_ref }}
          TARGET_REVISION: ${{ github.event.pull_request.base.sha }}
          INTEGRATION_COMMAND: ${{ inputs.integration_command }}
          SECURITY_COMMAND: ${{ inputs.security_command }}
          DEFERRED_STORIES: ${{ inputs.deferred_stories }}
          HOTFIX_INCIDENT: ${{ inputs.hotfix_incident }}
          HOTFIX_APPROVAL: ${{ inputs.hotfix_approval }}
        run: |
          python3 "$RUNNER_TEMP/workflows/scripts/release_readiness.py" \
            --evidence "$RUNNER_TEMP/release-readiness" \
            --integration-command "$INTEGRATION_COMMAND" --security-command "$SECURITY_COMMAND" \
            --deferrals "$DEFERRED_STORIES"
      - name: Retain candidate-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-readiness/
          if-no-files-found: error
          retention-days: 90

name: Deploy Ansible release

on:
  workflow_call:
    inputs:
      repository:
        description: Repository containing the release to deploy.
        required: true
        type: string
      ref:
        description: Immutable release tag to deploy.
        required: true
        type: string
      inventory_path:
        required: true
        type: string
      playbook_path:
        required: true
        type: string
      ansible_config_path:
        description: Optional repository-relative Ansible configuration path.
        required: false
        type: string
        default: ''
      ansible_tags:
        required: false
        type: string
        default: ''
      ansible_extra_vars:
        description: Optional non-secret Ansible extra variables (for example a runner-local secret-file path).
        required: false
        type: string
        default: ''
      environment_name:
        required: true
        type: string
      health_check_command:
        required: true
        type: string
      deployment_working_directory:
        required: false
        type: string
        default: '.'
      rollback_ref:
        description: Optional known-good tag. Empty discovers the prior successful environment deployment.
        required: false
        type: string
        default: ''
      concurrency_group:
        required: true
        type: string
      runner:
        description: JSON array of trusted runner labels.
        required: false
        type: string
        default: '["self-hosted"]'
      secrets_file:
        description: Optional protected runner-local environment file to source for Ansible.
        required: false
        type: string
        default: ''
      validation_command:
        description: Optional repository-local validation command, run before Ansible check/apply.
        required: false
        type: string
        default: ''
      check_command:
        description: Optional scoped Ansible check-mode command.
        required: false
        type: string
        default: ''
      privileged_deploy_command:
        description: Optional narrowly scoped runner-local privileged deployment entrypoint.
        required: false
        type: string
        default: ''
      privileged_health_check_command:
        description: Optional narrowly scoped runner-local privileged health entrypoint.
        required: false
        type: string
        default: ''
      privileged_check_command:
        description: Optional narrowly scoped runner-local Ansible check-mode entrypoint.
        required: false
        type: string
        default: ''
      deployment_state_file:
        description: Durable runner-local JSON metadata path for this isolated deployment target.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ref }} to ${{ inputs.environment_name }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    environment: ${{ inputs.environment_name }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.deployment_working_directory }}
    steps:
      - name: Check out immutable release
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify release checkout
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "${{ inputs.ref }}"
          echo "repository=${{ inputs.repository }} release=${{ inputs.ref }} environment=${{ inputs.environment_name }} start=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deployment tooling
        run: uv sync --frozen --group dev

      - name: Find previous successful release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          CURRENT_REF: ${{ inputs.ref }}
          REQUESTED_ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          if [[ -n "${{ inputs.deployment_state_file }}" && -r "${{ inputs.deployment_state_file }}" ]]; then
            previous_ref=$(jq -r '.current_release // empty' "${{ inputs.deployment_state_file }}")
            if [[ -n "$previous_ref" && "$previous_ref" != "$CURRENT_REF" ]]; then
              echo "ref=$previous_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -n "$REQUESTED_ROLLBACK_REF" ]]; then
            echo "ref=$REQUESTED_ROLLBACK_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployments=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=${DEPLOYMENT_ENVIRONMENT}&per_page=100")
          previous_ref=''
          while IFS= read -r deployment_id; do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" | jq -r '.[0].state // empty')
            ref=$(jq -r ".[] | select(.id == ${deployment_id}) | .ref" <<<"$deployments")
            if [[ "$status" == success && "$ref" != "$CURRENT_REF" ]]; then
              previous_ref="$ref"
              break
            fi
          done < <(jq -r '.[].id' <<<"$deployments")
          echo "ref=$previous_ref" >> "$GITHUB_OUTPUT"

      - name: Validate release and target
        env:
          SECRETS_FILE: ${{ inputs.secrets_file }}
          INVENTORY_PATH: ${{ inputs.inventory_path }}
          PLAYBOOK_PATH: ${{ inputs.playbook_path }}
          ANSIBLE_CONFIG: ${{ inputs.ansible_config_path }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
          CHECK_COMMAND: ${{ inputs.check_command }}
          PRIVILEGED_CHECK_COMMAND: ${{ inputs.privileged_check_command }}
        run: |
          set -euo pipefail
          if [[ -n "$SECRETS_FILE" ]]; then
            test -r "$SECRETS_FILE"
            set -a
            # shellcheck disable=SC1090 # Caller supplies a protected runner-local path.
            source "$SECRETS_FILE"
            set +a
          fi
          if [[ -n "$VALIDATION_COMMAND" ]]; then eval "$VALIDATION_COMMAND"; fi
          uv run ansible-inventory -i "$INVENTORY_PATH" --graph
          uv run ansible-playbook -i "$INVENTORY_PATH" "$PLAYBOOK_PATH" --syntax-check
          uv run ansible-lint "$PLAYBOOK_PATH"
          if [[ -n "$PRIVILEGED_CHECK_COMMAND" ]]; then
            eval "$PRIVILEGED_CHECK_COMMAND"
          elif [[ -n "$CHECK_COMMAND" ]]; then
            eval "$CHECK_COMMAND"
          fi

      - name: Apply release configuration
        id: apply
        continue-on-error: true
        env:
          SECRETS_FILE: ${{ inputs.secrets_file }}
          INVENTORY_PATH: ${{ inputs.inventory_path }}
          PLAYBOOK_PATH: ${{ inputs.playbook_path }}
          ANSIBLE_TAGS: ${{ inputs.ansible_tags }}
          ANSIBLE_EXTRA_VARS: ${{ inputs.ansible_extra_vars }}
          PRIVILEGED_DEPLOY_COMMAND: ${{ inputs.privileged_deploy_command }}
        run: |
          set -euo pipefail
          if [[ -n "$SECRETS_FILE" ]]; then
            set -a
            # shellcheck disable=SC1090 # Caller supplies a protected runner-local path.
            source "$SECRETS_FILE"
            set +a
          fi
          if [[ -n "$PRIVILEGED_DEPLOY_COMMAND" ]]; then
            eval "$PRIVILEGED_DEPLOY_COMMAND"
            exit 0
          fi
          args=()
          if [[ -n "$ANSIBLE_TAGS" ]]; then args+=(--tags "$ANSIBLE_TAGS"); fi
          if [[ -n "$ANSIBLE_EXTRA_VARS" ]]; then args+=(--extra-vars "$ANSIBLE_EXTRA_VARS"); fi
          uv run ansible-playbook -i "$INVENTORY_PATH" "$PLAYBOOK_PATH" "${args[@]}"

      - name: Run post-deploy health checks
        id: health
        # Run the wrapper unconditionally; GitHub otherwise applies an implicit
        # success guard around a continue-on-error deployment step.
        if: ${{ always() }}
        continue-on-error: true
        env:
          SECRETS_FILE: ${{ inputs.secrets_file }}
          HEALTH_CHECK_COMMAND: ${{ inputs.health_check_command }}
          PRIVILEGED_HEALTH_CHECK_COMMAND: ${{ inputs.privileged_health_check_command }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          if [[ "$APPLY_OUTCOME" != success ]]; then
            echo 'Health checks skipped because apply did not succeed.'
            exit 0
          fi
          if [[ -n "$SECRETS_FILE" ]]; then
            set -a
            # shellcheck disable=SC1090 # Caller supplies a protected runner-local path.
            source "$SECRETS_FILE"
            set +a
          fi
          if [[ -n "$PRIVILEGED_HEALTH_CHECK_COMMAND" ]]; then
            eval "$PRIVILEGED_HEALTH_CHECK_COMMAND"
          else
            eval "$HEALTH_CHECK_COMMAND"
          fi

      - name: Roll back previous successful release
        id: rollback
        if: ${{ (steps.apply.outcome == 'failure' || steps.health.outcome == 'failure') && steps.previous.outputs.ref != '' }}
        continue-on-error: true
        env:
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          SECRETS_FILE: ${{ inputs.secrets_file }}
          INVENTORY_PATH: ${{ inputs.inventory_path }}
          PLAYBOOK_PATH: ${{ inputs.playbook_path }}
          ANSIBLE_TAGS: ${{ inputs.ansible_tags }}
          ANSIBLE_EXTRA_VARS: ${{ inputs.ansible_extra_vars }}
          HEALTH_CHECK_COMMAND: ${{ inputs.health_check_command }}
          PRIVILEGED_DEPLOY_COMMAND: ${{ inputs.privileged_deploy_command }}
          PRIVILEGED_HEALTH_CHECK_COMMAND: ${{ inputs.privileged_health_check_command }}
        run: |
          set -euo pipefail
          git checkout --detach "$PREVIOUS_REF"
          if [[ -n "$SECRETS_FILE" ]]; then
            set -a
            # shellcheck disable=SC1090 # Caller supplies a protected runner-local path.
            source "$SECRETS_FILE"
            set +a
          fi
          if [[ -n "$PRIVILEGED_DEPLOY_COMMAND" ]]; then
            eval "$PRIVILEGED_DEPLOY_COMMAND"
          else
            args=()
          if [[ -n "$ANSIBLE_TAGS" ]]; then args+=(--tags "$ANSIBLE_TAGS"); fi
          if [[ -n "$ANSIBLE_EXTRA_VARS" ]]; then args+=(--extra-vars "$ANSIBLE_EXTRA_VARS"); fi
          uv run ansible-playbook -i "$INVENTORY_PATH" "$PLAYBOOK_PATH" "${args[@]}"
          fi
          if [[ -n "$PRIVILEGED_HEALTH_CHECK_COMMAND" ]]; then eval "$PRIVILEGED_HEALTH_CHECK_COMMAND"; else eval "$HEALTH_CHECK_COMMAND"; fi
          echo "Rolled back to $PREVIOUS_REF after failed deployment of ${{ inputs.ref }}."

      - name: Record durable deployment metadata
        if: ${{ always() && inputs.deployment_state_file != '' }}
        env:
          STATE_FILE: ${{ inputs.deployment_state_file }}
          RELEASE: ${{ inputs.ref }}
          TARGET: ${{ inputs.environment_name }}
          APPLY: ${{ steps.apply.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          PREVIOUS: ${{ steps.previous.outputs.ref }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = os.environ['STATE_FILE']
          try:
              with open(path) as stream:
                  state = json.load(stream)
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}
          success = os.environ['APPLY'] == 'success' and os.environ['HEALTH'] == 'success'
          if success:
              state['previous_successful_release'] = state.get('current_release')
              state['current_release'] = os.environ['RELEASE']
          state.update({
              'deployment_target': os.environ['TARGET'],
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'last_attempt_release': os.environ['RELEASE'],
              'last_attempt_state': 'success' if success else 'failure',
              'rollback_release': os.environ['PREVIOUS'] or None,
              'rollback_state': os.environ['ROLLBACK'] or 'not-needed',
          })
          temporary = path + '.tmp'
          with open(temporary, 'w') as stream:
              json.dump(state, stream, sort_keys=True)
              stream.write('\n')
          os.replace(temporary, path)
          PY

      - name: Report deployment result
        if: ${{ always() }}
        env:
          APPLY: ${{ steps.apply.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          echo "repository=${{ inputs.repository }} release=${{ inputs.ref }} environment=${{ inputs.environment_name }} end=$(date -u '+%Y-%m-%dT%H:%M:%SZ') apply=$APPLY health=$HEALTH rollback=${ROLLBACK:-not-needed}"
          if [[ "$APPLY" != success || ( -n "$HEALTH" && "$HEALTH" != success ) ]]; then
            if [[ -n "${{ steps.previous.outputs.ref }}" && "$ROLLBACK" != success ]]; then
              echo 'Automatic rollback failed. Re-run the consumer deploy workflow manually with the prior release tag after investigating the target.' >&2
            fi
            exit 1
          fi

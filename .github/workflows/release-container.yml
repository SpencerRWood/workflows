name: Validate and publish container release

on:
  workflow_call:
    inputs:
      workflow_revision:
        description: Shared helper revision; pin to the same SHA as this workflow.
        type: string
        required: false
        default: v3
      require_approval:
        description: Require separately authorized manual publication on main.
        type: boolean
        default: false
        required: false
      approved:
        description: Explicit publication authorization for this dispatch.
        type: boolean
        default: false
        required: false
      approved_revision:
        description: Exact reviewed main SHA; mandatory when require_approval is true.
        type: string
        required: false
        default: ''
      recovery_approved:
        description: Separate authorization to resume a partial publication or accept an existing candidate.
        type: boolean
        required: false
        default: false
      release_git_auth:
        description: Explicit Git writer authentication; github-app never falls back to the workflow token.
        type: string
        required: false
        default: github-token
      release_app_client_id:
        description: Reviewed release App client ID, required for github-app.
        type: string
        required: false
        default: ''
      release_app_slug:
        description: Reviewed release App slug, required for github-app.
        type: string
        required: false
        default: ''
    outputs:
      released:
        value: ${{ jobs.release.outputs.released }}
      release_tag:
        value: ${{ jobs.release.outputs.release_tag }}
      image_repository:
        value: ${{ jobs.release.outputs.image_repository }}
      version_image:
        value: ${{ jobs.release.outputs.version_image }}
      image_digest:
        value: ${{ jobs.release.outputs.image_digest }}
      version_image_digest:
        value: ${{ jobs.release.outputs.version_image_digest }}
    secrets:
      release_app_private_key:
        required: false
      dbt_host:
        required: false
      dbt_user:
        required: false
      dbt_password:
        required: false
      dbt_port:
        required: false
      dbt_dbname:
        required: false
      dbt_schema:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorization:
    uses: ./.github/workflows/authorize-operation.yml
    with:
      require_approval: ${{ inputs.require_approval }}
      approved: ${{ inputs.approved }}

  validation:
    needs: authorization
    uses: ./.github/workflows/validate.yml
    with:
      workflow_revision: ${{ inputs.workflow_revision }}
    secrets:
      dbt_host: ${{ secrets.dbt_host }}
      dbt_user: ${{ secrets.dbt_user }}
      dbt_password: ${{ secrets.dbt_password }}
      dbt_port: ${{ secrets.dbt_port }}
      dbt_dbname: ${{ secrets.dbt_dbname }}
      dbt_schema: ${{ secrets.dbt_schema }}

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_REQUIRED: ${{ inputs.require_approval }}
      APPROVED_REVISION: ${{ inputs.approved_revision }}
      RECOVERY_APPROVED: ${{ inputs.recovery_approved }}
      RELEASE_REF: ${{ github.ref }}
    outputs:
      released: ${{ steps.publish.outputs.released || 'false' }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      image_repository: ${{ steps.image.outputs.image_repository }}
      version_image: ${{ steps.image.outputs.version_image }}
      image_digest: ${{ steps.digest.outputs.digest }}
      version_image_digest: ${{ steps.image.outputs.version_image }}@${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure process-scoped read authentication
        run: gh auth setup-git

      - name: Check out workflow implementation
        env:
          WORKFLOW_SHA: ${{ inputs.workflow_revision }}
        run: |
          git init "$RUNNER_TEMP/workflow-contract"
          git -C "$RUNNER_TEMP/workflow-contract" remote add origin https://github.com/SpencerRWood/workflows.git
          git -C "$RUNNER_TEMP/workflow-contract" fetch --depth 1 origin "$WORKFLOW_SHA"
          git -C "$RUNNER_TEMP/workflow-contract" checkout --detach FETCH_HEAD

      - name: Set up configuration Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check release checkout is still the branch head
        id: current_head
        run: |
          python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current
          python "$RUNNER_TEMP/workflow-contract/scripts/release_registry.py" preflight --evidence "$RUNNER_TEMP/release-evidence"

      - name: Require explicit release Git credentials
        env:
          RELEASE_GIT_AUTH: ${{ inputs.release_git_auth }}
          RELEASE_APP_CLIENT_ID: ${{ inputs.release_app_client_id }}
          RELEASE_APP_SLUG: ${{ inputs.release_app_slug }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.release_app_private_key }}
        run: python "$RUNNER_TEMP/workflow-contract/scripts/release_credentials.py"

      - name: Load release configuration
        id: config
        run: python "$RUNNER_TEMP/workflow-contract/scripts/release_config.py" .github/release.toml

      - name: Require container publication
        run: test "${{ steps.config.outputs.container_publish }}" = true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.config.outputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ steps.config.outputs.working_directory }}/pyproject.toml
            ${{ steps.config.outputs.working_directory }}/uv.lock

      - name: Sync Python dependencies
        working-directory: ${{ steps.config.outputs.working_directory }}
        run: uv sync --frozen --group ${{ steps.config.outputs.dependency_group }}

      - name: Determine next version with semantic-release
        id: version
        if: steps.current_head.outputs.current == 'true'
        working-directory: ${{ steps.config.outputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/workflow-contract/scripts/semantic_release_config.py" pyproject.toml "$RUNNER_TEMP/semantic-release-config.json"
          tag="$(uv run semantic-release --config "$RUNNER_TEMP/semantic-release-config.json" version --print-tag)"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "semantic-release did not determine a stable release tag: $tag" >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq 'select(.draft == false and .prerelease == false) | .id' > "$RUNNER_TEMP/release-evidence/existing-release.txt"
            test -s "$RUNNER_TEMP/release-evidence/existing-release.txt" || {
              echo 'Existing Git tag lacks a completed Release; stop for separately authorized finalization.' >&2
              exit 1
            }
            echo "No new semantic release is due ($tag already exists)."
            exit 0
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare semantic release metadata without a commit or tag
        if: steps.version.outputs.release_tag != ''
        working-directory: ${{ steps.config.outputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run semantic-release --config "$RUNNER_TEMP/semantic-release-config.json" version --no-commit --no-tag --no-push --no-vcs-release --skip-build

      - name: Lock prepared version before building the candidate
        if: steps.version.outputs.release_tag != ''
        working-directory: ${{ steps.config.outputs.working_directory }}
        run: |
          set -euo pipefail
          # Version preparation may require metadata absent from the runner cache.
          uv lock
          git add uv.lock

      - name: Prepare candidate image references without a GitHub Release
        id: image
        if: steps.version.outputs.release_tag != ''
        env:
          REQUIRE_RELEASE: "false"
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          IMAGE_NAME: ${{ steps.config.outputs.container_image_name }}
          DOCKERFILE: ${{ steps.config.outputs.container_dockerfile }}
          BUILD_CONTEXT: ${{ steps.config.outputs.container_context }}
          PLATFORMS: ${{ steps.config.outputs.container_platforms }}
        run: python3 "$RUNNER_TEMP/workflow-contract/scripts/container_release.py"

      - name: Snapshot prepared candidate inputs
        id: provenance
        if: steps.version.outputs.release_tag != '' && inputs.require_approval
        env:
          SOURCE_REVISION: ${{ inputs.approved_revision }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WORKING_DIRECTORY: ${{ steps.config.outputs.working_directory }}
          DOCKERFILE: ${{ steps.config.outputs.container_dockerfile }}
          BUILD_CONTEXT: ${{ steps.config.outputs.container_context }}
          PLATFORMS: ${{ steps.config.outputs.container_platforms }}
        run: |
          test "$(git -C "$RUNNER_TEMP/workflow-contract" rev-parse HEAD)" = "$WORKFLOW_REVISION"
          python "$RUNNER_TEMP/workflow-contract/scripts/candidate_provenance.py" prepare --snapshot "$RUNNER_TEMP/candidate-inputs" --evidence "$RUNNER_TEMP/release-evidence"

      - name: Set up Docker Buildx
        if: steps.version.outputs.release_tag != ''
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: steps.version.outputs.release_tag != ''
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Find reusable commit-specific candidate
        id: existing
        if: steps.version.outputs.release_tag != ''
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.image_repository }}:candidate-${{ steps.image.outputs.commit_sha }}-${{ steps.version.outputs.release_tag }}
        run: |
          python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current
          python "$RUNNER_TEMP/workflow-contract/scripts/release_registry.py" find --evidence "$RUNNER_TEMP/release-evidence"

      - name: Require current approved main before candidate publication
        if: steps.version.outputs.release_tag != '' && steps.existing.outputs.digest == ''
        run: python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current

      - name: Build candidate image once
        id: candidate
        if: steps.version.outputs.release_tag != '' && steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ inputs.require_approval && format('{0}/candidate-inputs/{1}', runner.temp, steps.config.outputs.container_context) || steps.config.outputs.container_context }}
          file: ${{ inputs.require_approval && format('{0}/candidate-inputs/{1}', runner.temp, steps.config.outputs.container_dockerfile) || steps.config.outputs.container_dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          platforms: ${{ steps.config.outputs.container_platforms }}
          tags: ${{ steps.image.outputs.image_repository }}:candidate-${{ steps.image.outputs.commit_sha }}-${{ steps.version.outputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_tag }}
            io.wood.release.inputs=${{ steps.provenance.outputs.inputs_sha256 }}
          cache-from: type=gha,scope=${{ github.repository }}-container
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-container

      - name: Verify exact candidate digest
        id: digest
        if: steps.version.outputs.release_tag != ''
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.image_repository }}:candidate-${{ steps.image.outputs.commit_sha }}-${{ steps.version.outputs.release_tag }}
          EXPECTED_DIGEST: ${{ steps.existing.outputs.digest || steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          actual="sha256:$(docker buildx imagetools inspect "$CANDIDATE_IMAGE" --raw | sha256sum | cut -d ' ' -f1)"
          test "$actual" = "$EXPECTED_DIGEST"
          echo "digest=$actual" >> "$GITHUB_OUTPUT"

      - name: Capture candidate build receipt
        if: inputs.require_approval && steps.candidate.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          BUILD_METADATA: ${{ steps.candidate.outputs.metadata }}
        run: python "$RUNNER_TEMP/workflow-contract/scripts/candidate_provenance.py" receipt --evidence "$RUNNER_TEMP/release-evidence"

      - name: Attest candidate build provenance
        id: build_attestation
        if: inputs.require_approval && steps.candidate.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.image_repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign prepared candidate identity
        id: receipt_attestation
        if: inputs.require_approval && steps.candidate.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.image_repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://woodanalytics.dev/attestations/container-inputs/v1
          predicate-path: ${{ runner.temp }}/release-evidence/receipt.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify signed candidate identity and actual package
        if: steps.version.outputs.release_tag != '' && inputs.require_approval
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current
          python "$RUNNER_TEMP/workflow-contract/scripts/candidate_provenance.py" verify --evidence "$RUNNER_TEMP/release-evidence"

      - name: Validate exact Dagster candidate digest
        if: steps.version.outputs.release_tag != '' && steps.config.outputs.dagster_runtime_validation == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image_repository }}@${{ steps.digest.outputs.digest }}
          SMOKE_JOB: ${{ steps.config.outputs.dagster_smoke_job }}
          GRPC_PORT: ${{ steps.config.outputs.dagster_grpc_port }}
        run: python3 "$RUNNER_TEMP/workflow-contract/scripts/dagster_runtime.py" "$IMAGE" --smoke-job "$SMOKE_JOB" --grpc-port "$GRPC_PORT"

      - name: Validate exact application candidate digest
        if: steps.version.outputs.release_tag != '' && steps.config.outputs.runtime_validation == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image_repository }}@${{ steps.digest.outputs.digest }}
          CHECK_MODULE: ${{ steps.config.outputs.runtime_check_module }}
          TIMEOUT_SECONDS: ${{ steps.config.outputs.runtime_timeout_seconds }}
        run: python3 "$RUNNER_TEMP/workflow-contract/scripts/application_runtime.py" "$IMAGE" --check-module "$CHECK_MODULE" --timeout "$TIMEOUT_SECONDS"

      - name: Mint repository-scoped Git writer token
        id: release_app
        if: steps.version.outputs.release_tag != '' && inputs.release_git_auth == 'github-app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.release_app_client_id }}
          private-key: ${{ secrets.release_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          skip-token-revoke: false

      - name: Verify reviewed Git writer identity
        if: steps.version.outputs.release_tag != '' && inputs.release_git_auth == 'github-app'
        env:
          EXPECTED_SLUG: ${{ inputs.release_app_slug }}
          ACTUAL_SLUG: ${{ steps.release_app.outputs.app-slug }}
        run: test "$ACTUAL_SLUG" = "$EXPECTED_SLUG"

      - name: Publish the validated digest under release image tags
        timeout-minutes: 10
        if: steps.version.outputs.release_tag != ''
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.image_repository }}@${{ steps.digest.outputs.digest }}
          VERSION_IMAGE: ${{ steps.image.outputs.version_image }}
          SHA_IMAGE: ${{ steps.image.outputs.sha_image }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current
          python "$RUNNER_TEMP/workflow-contract/scripts/release_registry.py" promote --evidence "$RUNNER_TEMP/release-evidence"

      - name: Finalize semantic-release and GitHub Release
        id: publish
        timeout-minutes: 10
        if: steps.version.outputs.release_tag != ''
        working-directory: ${{ steps.config.outputs.working_directory }}
        env:
          RELEASE_GIT_AUTH: ${{ inputs.release_git_auth }}
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_GIT_AUTH" == github-app ]]; then
            test -n "$RELEASE_APP_TOKEN"
            export GH_TOKEN="$RELEASE_APP_TOKEN"
          elif [[ "$RELEASE_GIT_AUTH" == github-token ]]; then
            export GH_TOKEN="$WORKFLOW_TOKEN"
          else
            exit 1
          fi
          export GITHUB_TOKEN="$GH_TOKEN"
          python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py" --require-current
          actual_tag="$(uv run semantic-release --config "$RUNNER_TEMP/semantic-release-config.json" version --print-tag)"
          test "$actual_tag" = "$EXPECTED_TAG" || { echo "semantic-release version changed during validation: $EXPECTED_TAG -> $actual_tag" >&2; exit 1; }
          if ! uv run semantic-release --config "$RUNNER_TEMP/semantic-release-config.json" version --vcs-release; then
            echo "Publication failed after image validation. The image tags remain; inspect Git tag and GitHub Release before retrying." >&2
            exit 1
          fi
          test "$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")" = "$(git rev-parse HEAD)"
          if [[ "$APPROVAL_REQUIRED" == true ]]; then
            python "$RUNNER_TEMP/workflow-contract/scripts/candidate_provenance.py" finalized --evidence "$RUNNER_TEMP/release-evidence"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" --jq 'select(.draft == false and .prerelease == false) | .id' > "$RUNNER_TEMP/release-evidence/final-release.txt"
          test -s "$RUNNER_TEMP/release-evidence/final-release.txt"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Capture available Buildx evidence after interruption
        if: always() && steps.candidate.outputs.metadata != ''
        env:
          BUILD_METADATA: ${{ steps.candidate.outputs.metadata }}
        run: python "$RUNNER_TEMP/workflow-contract/scripts/candidate_provenance.py" capture --evidence "$RUNNER_TEMP/release-evidence"

      - name: Preserve publication evidence after success or interruption
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-evidence/
            ${{ steps.build_attestation.outputs.bundle-path }}
            ${{ steps.receipt_attestation.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 90

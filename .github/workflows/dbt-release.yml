name: dbt release

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version used for validation.
        required: false
        type: string
        default: "3.14"
      dbt_parse_enabled:
        description: Whether to run dbt parse with the supplied connection secrets.
        required: false
        type: boolean
        default: false
    secrets:
      github_token:
        description: Token used by semantic-release to create GitHub releases.
        required: true
      dbt_host:
        required: false
      dbt_user:
        required: false
      dbt_password:
        required: false
      dbt_database:
        required: false
      dbt_schema:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Pin release branch to workflow commit
        run: git reset --hard ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run SQLFluff lint
        run: uv run sqlfluff lint . --templater jinja

      - name: Run dbt deps
        run: uv run dbt deps

      - name: Run dbt parse
        if: ${{ inputs.dbt_parse_enabled }}
        env:
          DBT_HOST: ${{ secrets.dbt_host }}
          DBT_USER: ${{ secrets.dbt_user }}
          DBT_PASSWORD: ${{ secrets.dbt_password }}
          DBT_DATABASE: ${{ secrets.dbt_database }}
          DBT_SCHEMA: ${{ secrets.dbt_schema }}
        run: |
          cp profiles.example.yml profiles.yml
          uv run dbt parse --profiles-dir . --no-version-check

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files

      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: uv run semantic-release version --vcs-release

name: Python release

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing pyproject.toml and uv.lock.
        required: false
        type: string
        default: .
      python_version:
        description: Python version used for validation.
        required: false
        type: string
        default: "3.14"
    secrets:
      github_token:
        description: Token used by semantic-release to create GitHub releases.
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Pin release branch to workflow commit
        run: git reset --hard ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ inputs.working_directory }}/pyproject.toml
            ${{ inputs.working_directory }}/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Run mypy
        run: uv run mypy

      - name: Run pytest
        run: uv run pytest

      - name: Run pre-commit
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files

      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        run: uv run semantic-release version --vcs-release

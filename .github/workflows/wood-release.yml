{
  "name": "Release",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "release": {
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'",
      "permissions": {
        "contents": "write"
      },
      "uses": "SpencerRWood/workflows/.github/workflows/release.yml@613bb7d915cec854b5f7f2b5d26e963c8a4ada3f",
      "with": {
        "workflow_revision": "613bb7d915cec854b5f7f2b5d26e963c8a4ada3f"
      },
      "secrets": {
        "dbt_host": "${{ secrets.DBT_HOST }}",
        "dbt_user": "${{ secrets.DBT_USER }}",
        "dbt_password": "${{ secrets.DBT_PASSWORD }}",
        "dbt_port": "${{ secrets.DBT_PORT }}",
        "dbt_dbname": "${{ secrets.DBT_DBNAME }}",
        "dbt_schema": "${{ secrets.DBT_SCHEMA }}"
      }
    }
  }
}

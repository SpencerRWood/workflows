name: Release

on:
  workflow_call:
    outputs:
      released:
        description: Whether semantic-release published a release during this run.
        value: ${{ jobs.release.outputs.released }}
      release_tag:
        description: Immutable tag published by semantic-release, when one was created.
        value: ${{ jobs.release.outputs.release_tag }}
    secrets:
      dbt_host:
        description: dbt connection host, required only for the dbt-parse capability.
        required: false
      dbt_user:
        description: dbt connection user, required only for the dbt-parse capability.
        required: false
      dbt_password:
        description: dbt connection password, required only for the dbt-parse capability.
        required: false
      dbt_port:
        description: Optional dbt connection port for the dbt-parse capability.
        required: false
      dbt_dbname:
        description: Optional dbt database name for the dbt-parse capability.
        required: false
      dbt_schema:
        description: Optional dbt schema for the dbt-parse capability.
        required: false

permissions:
  contents: read

concurrency:
  # Keep one active release and the newest pending run for each caller branch.
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: SpencerRWood/workflows/.github/workflows/validate.yml@v1
    secrets:
      dbt_host: ${{ secrets.dbt_host }}
      dbt_user: ${{ secrets.dbt_user }}
      dbt_password: ${{ secrets.dbt_password }}
      dbt_port: ${{ secrets.dbt_port }}
      dbt_dbname: ${{ secrets.dbt_dbname }}
      dbt_schema: ${{ secrets.dbt_schema }}

  release:
    name: Release after validation
    needs: validation
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic_release.outputs.released || 'false' }}
      release_tag: ${{ steps.semantic_release.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out workflow implementation
        # Keep helper code outside the consumer checkout so repository tools
        # cannot scan it as application code.
        env:
          # job.workflow_sha identifies this reusable workflow, not the caller.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          git init "$RUNNER_TEMP/workflow-contract"
          git -C "$RUNNER_TEMP/workflow-contract" remote add origin https://github.com/SpencerRWood/workflows.git
          git -C "$RUNNER_TEMP/workflow-contract" fetch --depth 1 origin "$WORKFLOW_SHA"
          git -C "$RUNNER_TEMP/workflow-contract" checkout --detach FETCH_HEAD

      - name: Set up configuration Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Load release configuration
        id: config
        run: python "$RUNNER_TEMP/workflow-contract/scripts/release_config.py" .github/release.toml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.config.outputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ steps.config.outputs.working_directory }}/pyproject.toml
            ${{ steps.config.outputs.working_directory }}/uv.lock

      - name: Sync Python dependencies
        working-directory: ${{ steps.config.outputs.working_directory }}
        run: uv sync --frozen --group ${{ steps.config.outputs.dependency_group }}

      - name: Check release checkout is still the branch head
        id: current_head
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python "$RUNNER_TEMP/workflow-contract/scripts/release_head.py"

      - name: Run semantic-release
        id: semantic_release
        if: steps.current_head.outputs.current == 'true'
        working-directory: ${{ steps.config.outputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --list > "$RUNNER_TEMP/tags-before-release"
          python "$RUNNER_TEMP/workflow-contract/scripts/semantic_release_config.py" pyproject.toml "$RUNNER_TEMP/semantic-release-config.json"
          uv run semantic-release --config "$RUNNER_TEMP/semantic-release-config.json" version --vcs-release
          release_tag="$(git tag --points-at HEAD --sort=-v:refname | head -n 1)"
          if [[ -n "$release_tag" ]] && ! grep -Fxq "$release_tag" "$RUNNER_TEMP/tags-before-release"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo 'release_tag=' >> "$GITHUB_OUTPUT"
          fi

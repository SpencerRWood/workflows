name: Publish and deploy approved release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    uses: SpencerRWood/workflows/.github/workflows/release.yml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      workflow_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      release_integration: true
      readiness_check: readiness / release-readiness
